<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>WaveRune — Audio watermarking in your browser</title>
    <meta
      name="description"
      content="Embed and detect a 32-bit watermark in WAV audio, entirely in your browser. Try WaveRune, the open-source audio watermarking library for Node.js and Bun."
    />
    <meta
      name="theme-color"
      content="#f4f7fb"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./favicon.svg"
    />
    <script>
      // Apply the saved theme before the first paint. Mirrors readStoredTheme in theme.ts.
      try {
        const theme = localStorage.getItem('waverune-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link
      rel="stylesheet"
      href="./styles.css"
    />
    <script
      defer
      src="https://umami.niroomand.dev/script.js"
      data-website-id="5cac7b08-5d54-4a12-9c2b-bfad45227d85"
    ></script>
    <script
      defer
      src="https://umami.niroomand.dev/recorder.js"
      data-website-id="5cac7b08-5d54-4a12-9c2b-bfad45227d85"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="./app.tsx"
    ></script>
  </body>
</html>
