name: Demo (GitHub Pages)

# Builds the demo page as one self-contained HTML file and publishes it to
# GitHub Pages. The page runs the library in the browser; nothing is uploaded
# to a server. Pages must be set to "GitHub Actions" as the source once, in
# the repository settings.
on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'src/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run demo:build
      - run: test -s dist-demo/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
